<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UCC ML Lab — screening borrower and lender names</title>
<meta name="description" content="A name-screening model for heavy-construction-equipment finance, measured against the frozen rules on held-out test data.">
<link rel="stylesheet" href="../assets/ml-lab.css">
<link rel="stylesheet" href="../assets/ml-map.css">
</head>
<body class="mll-page">
<main id="ml-lab">
  <noscript>
    <p class="mll-noscript">The ML Lab needs JavaScript to read its published release files. The data is plain JSON in
      <a href="../data/ml/manifest.json">data/ml/manifest.json</a>, and the map is on <a href="../">the main page</a>.</p>
  </noscript>
</main>
<section id="ml-map" aria-labelledby="ml-map-heading"></section>
<script src="../assets/ml-lab.js"></script>
<script src="../assets/ml-map.js"></script>
<script>
  window.mountMLLab(document.getElementById('ml-lab'), { dataBase: '../data/ml/' });
  window.mountMLMap(document.getElementById('ml-map'), { dataUrl: '../data/ml/map_zips.json', reliefBase: '../data/' });
</script>
</body>
</html>
