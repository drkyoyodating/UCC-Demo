[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucc-ml"
version = "0.1.0"
description = "UCC ML Lab: candidate dataset, blind labels, model, evaluation and serving for heavy-construction-equipment relevance screening"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
# Deliberately unpinned: ml/requirements-ml.lock.txt (pip freeze of .venv-ml) is the pin.
dependencies = [
  "duckdb",
  "pandas",
  "pyarrow",
  "numpy",
  "scipy",
  "scikit-learn",
  "pydantic>=2",
  "pyyaml",
  "openpyxl",
  "joblib",
  "mlflow",
  "dagster",
  "fastapi",
  "uvicorn",
  "httpx",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ucc-ml = "ucc_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ucc_ml = ["vendor/MANIFEST.json"]
